---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/timmy/public_html/guestbook
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R *.php $DEPLOYPATH
    - /bin/cp -R *.css $DEPLOYPATH
    # Only copy .txt files if they do not already exist on the server
    - for f in *.txt; do if [ ! -f "$DEPLOYPATH/$f" ]; then /bin/cp "$f" "$DEPLOYPATH"; fi; done
    - /bin/cp prefs.local.php.example $DEPLOYPATH
    - /bin/cp -R smilies $DEPLOYPATH 2>/dev/null || true
    # Set permissions on all guestbook data files to 640 (rw-r-----) to protect sensitive data
    - for f in entries.txt tempentries.txt spamwords.txt iplist.txt websites.txt; do if [ -f "$DEPLOYPATH/$f" ]; then /bin/chmod 640 "$DEPLOYPATH/$f"; fi; done
